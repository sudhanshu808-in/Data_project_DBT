[project]
name = "data-project-dbt"
version = "0.1.0"
description = "Olist replay generator and CDC pipeline (Neon Postgres -> Lakeflow Connect -> dbt on Databricks -> Airflow)"
readme = "README.md"
authors = [
    { name = "sudhanshu808-in", email = "shudhanshukaprowan@gmail.com" }
]
requires-python = ">=3.12"
# Airflow is NOT listed here: it runs inside Docker (see airflow/).
dependencies = [
    "psycopg[binary]>=3.2",   # Postgres driver for the generator (talks to Neon)
    "python-dotenv>=1.0",     # loads connection settings from .env
    "dbt-core>=1.12.6",       # run dbt locally while developing models
    "dbt-databricks>=1.10.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv.build-backend]
module-name = "olist_sim"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"
